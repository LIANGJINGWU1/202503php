<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恼人的广告页面</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            overflow: hidden;
        }
        .ad-box {
            position: fixed;
            width: 400px;
            height: 500px;
            background-color: red;
            color: white;
            text-align: center;
            line-height: 150px;
            font-size: 18px;
            animation: blink 0.1s infinite alternate;/* 闪烁,0.1s一次,无限次,交替正反 */
        }
        @keyframes blink {
            from { opacity: 0.5; }
            to { opacity: 1; }
            /* 0% { opacity: 0.5; transform: translateX(-5px); }
            50% { opacity: 1; transform: translateX(5px); }
            100% { opacity: 0.5; transform: translateX(-5px); } */
            0% { transform: translate(2px, 2px); }
            25% { transform: translate(-2px, -2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, 2px); }
            100% { transform: translate(2px, 2px); }

        }
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; }
        .popup {
            position: fixed;
            width: 300px;
            height: 200px;
            background-color: yellow;
            color: black;
            border: 2px solid red;
            display: none;/* 默认隐藏 */
            z-index: 100; /* 使弹窗显示在最上层 */
        }
        .close-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 8px;
            background-color: white;
            border: 1px solid black;
            padding: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="ad-box top-left">广告1</div>
    <div class="ad-box top-right">广告2</div>
    <div class="ad-box bottom-left">广告3</div>
    <div class="ad-box bottom-right">广告4</div>

    <div class="popup" id="popup">
        <span class="close-btn" onclick="hidePopup()">✖</span>
        <p>您的电脑已经感染病毒！</p>
        <p>请立即点击修复！</p>
    </div>

    <script>
        function showPopup() {
            const popup = document.getElementById("popup");
            popup.style.display = "block";
            popup.style.left = Math.random() * (window.innerWidth - 300) + "px";
            popup.style.top = Math.random() * (window.innerHeight - 200) + "px";
        }

        function hidePopup() {
            const popup = document.getElementById("popup");
            popup.style.display = "none";
        }

        setInterval(showPopup, 3000);
    </script>
</body>
</html>
